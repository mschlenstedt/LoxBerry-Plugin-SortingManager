<div class="lb-content" id="sm-page" data-form="overview">

<div class="sm-switch" id="ov-switch"></div>
<div id="ov-card"></div>

<h2 class="sm-title"><TMPL_VAR OVERVIEW.TITLE></h2>
<p class="sm-lead"><TMPL_VAR OVERVIEW.LEAD> <a href="<TMPL_VAR WIKI_URL>" target="_blank" rel="noopener"><TMPL_VAR COMMON.MORE></a></p>

<div id="ov-error"></div>

<div class="sm-ft">
	<div class="sm-ft-col">
		<h3><TMPL_VAR OVERVIEW.FROM></h3>
		<div class="sm-list" id="ov-src"><p class="sm-muted"><TMPL_VAR COMMON.LOADING></p></div>
		<div class="sm-ft-off" id="ov-src-off"></div>
	</div>
	<div class="sm-ft-arrow" aria-hidden="true"><i class="pi pi-arrow-right"></i></div>
	<div class="sm-ft-col">
		<h3><TMPL_VAR OVERVIEW.TO>
			<span class="sm-ft-quick" id="ov-quick">
				<button type="button" class="lb-btn lb-btn-sm" data-quick="user"><TMPL_VAR OVERVIEW.QUICK_USERS></button>
				<button type="button" class="lb-btn lb-btn-sm" data-quick="tablet"><TMPL_VAR OVERVIEW.QUICK_TABLETS></button>
				<button type="button" class="lb-btn lb-btn-sm" data-quick="none"><TMPL_VAR OVERVIEW.QUICK_NONE></button>
			</span>
		</h3>
		<div class="sm-list" id="ov-tgt"></div>
	</div>
</div>

<p class="sm-orph" id="ov-orphans" hidden></p>

<!-- Summary, reboot switch and the two buttons; during a copy the progress -->
<div class="sm-bar" id="ov-bar"></div>

<!-- Callouts after a copy: reboot, tablets, failed targets -->
<div id="ov-notes"></div>

</div>
