<div class="lb-content" id="sm-page" data-form="backup">

<div class="sm-ctx" id="ctx"></div>

<h2 class="sm-title"><TMPL_VAR BACKUP.TITLE></h2>
<p class="sm-lead"><TMPL_VAR BACKUP.LEAD></p>

<div id="b-error"></div>

<div class="lb-card sm-bcard" id="b-card">
	<div class="sm-bgrid">
		<div class="first">
			<label class="lb-toggle"><input type="checkbox" id="b-on" aria-label="<TMPL_VAR BACKUP.SCHED_ON>"><span class="lb-toggle-slider"></span></label>
			<span><span class="sm-k"><TMPL_VAR BACKUP.NEXT></span><span class="sm-v" id="b-next">–</span><span class="sm-sub" id="b-next-sub"></span></span>
		</div>
		<div><span class="sm-k"><TMPL_VAR BACKUP.KEEP></span><span class="sm-v" id="b-keepinfo">–</span><span class="sm-sub" id="b-keepsub"></span></div>
		<div><span class="sm-k"><TMPL_VAR BACKUP.SPACE></span><span class="sm-v" id="b-space">–</span><span class="sm-sub" id="b-free"></span></div>
		<div><button type="button" class="lb-btn lb-btn-primary" id="b-now"><i class="pi pi-download"></i> <TMPL_VAR BACKUP.BTN_NOW></button></div>
	</div>
	<div class="sm-brun" id="b-runline" role="status"></div>
</div>

<details class="lb-collapsible sm-sched" id="b-sched" open>
	<summary><TMPL_VAR BACKUP.SCHED> <span class="sm-toast" id="b-toast" role="status"><i class="pi pi-check"></i><TMPL_VAR COMMON.SAVED></span></summary>
	<div class="lb-collapsible-content" id="b-dep">
		<div class="lb-form-row">
			<label class="lb-form-label"><TMPL_VAR BACKUP.WHEN></label>
			<div class="lb-form-field lb-schedule-field">
				<div class="lb-btn-group" id="b-days">
					<input type="checkbox" id="b-d1" value="1"><label for="b-d1"><TMPL_VAR COMMON.MON></label>
					<input type="checkbox" id="b-d2" value="2"><label for="b-d2"><TMPL_VAR COMMON.TUE></label>
					<input type="checkbox" id="b-d3" value="3"><label for="b-d3"><TMPL_VAR COMMON.WED></label>
					<input type="checkbox" id="b-d4" value="4"><label for="b-d4"><TMPL_VAR COMMON.THU></label>
					<input type="checkbox" id="b-d5" value="5"><label for="b-d5"><TMPL_VAR COMMON.FRI></label>
					<input type="checkbox" id="b-d6" value="6"><label for="b-d6"><TMPL_VAR COMMON.SAT></label>
					<input type="checkbox" id="b-d0" value="0"><label for="b-d0"><TMPL_VAR COMMON.SUN></label>
				</div>
				<input class="lb-input sm-time" type="time" id="b-time" value="03:00" aria-label="<TMPL_VAR BACKUP.TIME>">
			</div>
		</div>
		<div class="lb-form-help sm-next" id="b-nodays" hidden><i class="pi pi-exclamation-triangle"></i><TMPL_VAR BACKUP.NODAYS></div>
		<div class="lb-form-row">
			<label class="lb-form-label" for="b-rep"><TMPL_VAR BACKUP.REPEAT></label>
			<div class="lb-form-field"><select class="lb-select sm-sel" id="b-rep" data-role="none"></select></div>
		</div>
		<div class="lb-form-row">
			<label class="lb-form-label" for="b-keep"><TMPL_VAR BACKUP.KEEP_LBL></label>
			<div class="lb-form-field"><select class="lb-select sm-sel" id="b-keep" data-role="none"></select></div>
		</div>
		<div class="lb-form-help"><TMPL_VAR BACKUP.KEEP_HINT></div>
	</div>
</details>

<h3 class="sm-h3"><TMPL_VAR BACKUP.ARCHIVES> <span class="sm-sub" id="b-count"></span></h3>
<div class="sm-arch" id="b-list"><p class="sm-muted"><TMPL_VAR COMMON.LOADING></p></div>

</div>
