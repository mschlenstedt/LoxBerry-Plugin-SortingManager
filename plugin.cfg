[AUTHOR]
# NEVER CHANGE this information in future updates! LoxBerry uses it to identify
# the plugin and to handle updates. Changing it makes LoxBerry treat this as a
# different plugin and updates will fail.
NAME=Michael Schlenstedt
EMAIL=michael@loxberry.de

[PLUGIN]
# The version of this plugin.
VERSION=0.1

# Short name and preferred subfolder. If the name already exists on the
# installation system, LoxBerry appends 01, 02, ... - therefore no script may
# ever assume the literal folder name. NEVER CHANGE these two values.
NAME=sortingmanager
FOLDER=sortingmanager

# Friendly long name, 25 characters maximum.
TITLE=Sorting Manager
WEBSITE=https://wiki.loxberry.de/plugins/sortingmanager/start

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/mschlenstedt/LoxBerry-Plugin-SortingManager/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/mschlenstedt/LoxBerry-Plugin-SortingManager/main/prerelease.cfg

[SYSTEM]
# No reboot needed: the plugin installs no udev rule and no system service.
REBOOT=false

# LoxBerry::Auth, which this plugin needs to write to the Miniserver, ships
# with 4.0.1.
# TEMPORARY: lowered to 4.0.0.15 for testing on a box running the core from
# master. Set back to 4.0.1 before the first release.
LB_MINIMUM=4.0.0.15
LB_MAXIMUM=false

# Pure Perl, no architecture-specific parts.
ARCHITECTURE=""

# The plugin log level drives the log level of the cron job and the background
# jobs, so the user needs the selector in the plugin management widget.
CUSTOM_LOGLEVELS=true

# Plugin Interface
INTERFACE=2.0
